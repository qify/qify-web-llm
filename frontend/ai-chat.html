<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>画世界 - AI 陪画助手</title>
  <link rel="stylesheet" href="css/art.css">
  <link rel="stylesheet" href="css/ai-chat.css">
</head>
<body class="qfy_art_body">
  <div class="qfy_cs_page">
    <header class="qfy_nav_bar">
      <a class="qfy_nav_back" href="art-profile.html">‹</a>
      <span class="qfy_nav_title">AI 陪画助手</span>
      <span class="qfy_nav_side"></span>
    </header>

    <p class="qfy_cs_api_line">后端接口：<a class="qfy_cs_api_link" href="/api/ai/chat/stream" target="_blank">POST /api/ai/chat/stream</a></p>

    <section class="qfy_cs_sessions">
      <button class="qfy_chip" id="qfy_new_session" type="button">＋ 新建会话</button>
      <ul class="qfy_chip_list" id="qfy_session_list"></ul>
    </section>

    <div class="qfy_cs_msgs" id="qfy_chat_messages"></div>

    <div class="qfy_cs_input_row">
      <textarea class="qfy_cs_input" id="qfy_chat_input"
                placeholder="输入你的问题，Enter 发送，Shift + Enter 换行"></textarea>
      <button class="qfy_cs_send" id="qfy_chat_send" type="button">发送</button>
      <button class="qfy_btn qfy_btn_ghost" id="qfy_chat_stop" type="button" disabled>停止</button>
    </div>

    <p class="qfy_cs_status" id="qfy_chat_status">模型：deepseek-ai/DeepSeek-V4-Flash · 流式输出</p>
  </div>

  <script src="js/origin_guard.js"></script>
  <script src="js/ai_chat.js"></script>
</body>
