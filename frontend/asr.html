<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>画世界 - 语音提问</title>
  <link rel="stylesheet" href="css/art.css">
  <link rel="stylesheet" href="css/asr.css">
</head>
<body class="qfy_art_body">
  <div class="qfy_main">
    <header class="qfy_nav_bar">
      <a class="qfy_nav_back" href="art-profile.html">‹</a>
      <span class="qfy_nav_title">语音提问</span>
      <span class="qfy_nav_side"></span>
    </header>

    <p class="qfy_cs_api_line">后端接口：<a class="qfy_cs_api_link" href="/api/asr" target="_blank">POST /api/asr</a></p>

    <section class="qfy_card_block">
      <p class="qfy_sec_title">上传音频<span class="qfy_sec_sub">wav / mp3 / m4a / ogg / webm，≤ 20MB</span></p>
      <label class="qfy_upload_box">
        <input type="file" id="qfy_asr_file" accept="audio/*">
        选择音频
      </label>
      <button class="qfy_btn qfy_btn_block" id="qfy_asr_upload_btn" type="button">上传识别</button>
    </section>

    <section class="qfy_card_block">
      <p class="qfy_sec_title">现场录音<span class="qfy_sec_sub">对着麦克风说出你的问题</span></p>
      <button class="qfy_btn qfy_btn_ghost qfy_btn_block" id="qfy_asr_record_btn" type="button">开始录音</button>
      <p class="qfy_asr_record_tip" id="qfy_asr_record_tip">点击开始录音，再次点击结束并识别</p>
    </section>

    <section class="qfy_card_block">
      <p class="qfy_sec_title">音频预览</p>
      <audio class="qfy_asr_audio" id="qfy_asr_audio" controls hidden></audio>
      <p class="qfy_empty" id="qfy_asr_tip">选择音频或录音后，识别结果会显示在下方。</p>
    </section>

    <div class="qfy_card_block" id="qfy_asr_result" hidden>
      <p class="qfy_sec_title">识别文字</p>
      <p class="qfy_result" id="qfy_asr_text"></p>
      <p class="qfy_news_meta" id="qfy_asr_meta"></p>
    </div>

    <p class="qfy_art_footer">© 2026 齐方圆 · 24001011031 · 画世界</p>
  </div>

  <script src="js/origin_guard.js"></script>
  <script src="js/asr.js"></script>
</body>
</html>
