<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>画世界 - 数据库连接</title>
  <link rel="stylesheet" href="css/art.css">
  <link rel="stylesheet" href="css/database.css">
</head>
<body class="qfy_art_body">
  <div class="qfy_main">
    <header class="qfy_nav_bar">
      <a class="qfy_nav_back" href="art-profile.html">‹</a>
      <span class="qfy_nav_title">数据库连接</span>
      <span class="qfy_nav_side"></span>
    </header>

    <p class="qfy_cs_api_line">后端接口：
      <a class="qfy_cs_api_link" href="/api/db/connect" target="_blank">POST /api/db/connect</a>
    </p>

    <form id="qfy_db_form" class="qfy_card_block">
      <p class="qfy_sec_title">MySQL 连接测试<span class="qfy_sec_sub">默认 root / 123456</span></p>

      <div class="qfy_field">
        <label class="qfy_field_label" for="qfy_username">用户名</label>
        <input class="qfy_input" id="qfy_username" name="username" type="text"
               value="root" placeholder="请输入 MySQL 用户名" autocomplete="username">
      </div>

      <div class="qfy_field">
        <label class="qfy_field_label" for="qfy_password">密码</label>
        <input class="qfy_input" id="qfy_password" name="password" type="password"
               value="123456" placeholder="请输入 MySQL 密码" autocomplete="current-password">
      </div>

      <button class="qfy_btn qfy_btn_block" id="qfy_conn_btn" type="submit">连接数据库</button>
    </form>

    <p id="qfy_db_msg" class="qfy_msg"></p>

    <footer class="qfy_art_footer">© 2026 齐方圆 · 24001011031 · 画世界</footer>
  </div>

  <script src="js/database.js"></script>
</body>
</html>
