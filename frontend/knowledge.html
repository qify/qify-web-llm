<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>画世界 - 绘画知识库</title>
  <link rel="stylesheet" href="css/art.css">
  <link rel="stylesheet" href="css/knowledge.css">
</head>
<body class="qfy_art_body">
  <div class="qfy_main">
    <header class="qfy_nav_bar">
      <a class="qfy_nav_back" href="art-profile.html">‹</a>
      <span class="qfy_nav_title">绘画知识库</span>
      <span class="qfy_nav_side"></span>
    </header>

    <p class="qfy_cs_api_line">后端接口：
      <a class="qfy_cs_api_link" href="/api/kb/documents" target="_blank">GET /api/kb/documents</a>
      <a class="qfy_cs_api_link" href="/api/kb/upload" target="_blank">POST /api/kb/upload</a>
      <a class="qfy_cs_api_link" href="/api/kb/ask" target="_blank">POST /api/kb/ask</a>
    </p>

    <div class="qfy_card_block">
      <p class="qfy_sec_title">上传知识库文件 <span class="qfy_sec_sub">解析后自动切块入库</span></p>
      <label class="qfy_upload_box">
        <input type="file" id="qfy_kb_file"
               accept=".txt,.md,.pdf,.doc,.docx,.ppt,.pptx">
        点击选择文件 · 支持 txt / md / pdf / docx / pptx
      </label>
      <button class="qfy_btn qfy_btn_block" id="qfy_kb_upload_btn" type="button">上传并解析</button>
      <p class="qfy_empty" id="qfy_kb_upload_tip">支持 txt / md / pdf / doc / docx / pptx（旧版 .ppt 请另存为 .pptx），单文件不超过 20MB。</p>
    </div>

    <div class="qfy_card_block">
      <p class="qfy_sec_title">知识库文件 <span class="qfy_sec_sub">可删除单个文档</span></p>
      <table class="qfy_kb_list">
        <tbody id="qfy_kb_doc_body">
          <tr><td colspan="7" class="qfy_kb_empty">加载中…</td></tr>
        </tbody>
      </table>
    </div>

    <div class="qfy_card_block">
      <p class="qfy_sec_title">基于知识库提问 <span class="qfy_sec_sub">检索 Top3 资料后作答</span></p>
      <textarea class="qfy_textarea" id="qfy_kb_question"
                placeholder="例如：勾线时线条总是抖，应该怎么练习？Enter 提问，Shift + Enter 换行"></textarea>
      <button class="qfy_btn qfy_btn_block" id="qfy_kb_ask_btn" type="button">提问</button>
      <p class="qfy_empty" id="qfy_kb_ask_tip">提问后，后端会把 Top3 相关资料与大模型请求、响应打印到后端控制台。</p>
    </div>

    <div class="qfy_card_block" id="qfy_kb_answer" hidden>
      <p class="qfy_sec_title">回答</p>
      <p class="qfy_result" id="qfy_kb_answer_text"></p>
      <p class="qfy_sec_title qfy_kb_src_title">引用资料</p>
      <div id="qfy_kb_sources"></div>
    </div>

    <div class="qfy_art_footer">© 2026 齐方圆 · 24001011031 · 画世界</div>
  </div>

  <script src="js/origin_guard.js"></script>
  <script src="js/knowledge.js"></script>
</body>
</html>
