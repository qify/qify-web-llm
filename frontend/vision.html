<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网页设计课程作业 - 图像识别</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 姓名：齐方圆 | 学号：24001011031 | 时间：2026-11-23 | 大模型：DeepSeek-V4.1-Flash -->

  <main class="qfy_page">
    <header class="qfy_hero">
      <div class="qfy_card qfy_card_wide">
        <p class="qfy_eyebrow">视觉大模型 · 图像识别</p>
        <h1 class="qfy_title qfy_title_sm">图像识别</h1>
        <p class="qfy_subtitle">上传图片，由视觉大模型返回画面描述</p>

        <div class="qfy_api_box">
          <span class="qfy_api_label">后端接口</span>
          <a class="qfy_api_link" href="/api/vision" target="_blank">POST /api/vision</a>
        </div>

        <div class="qfy_vision_upload">
          <label class="qfy_vision_drop" id="qfy_vision_drop" for="qfy_vision_file">
            <input class="qfy_vision_file" id="qfy_vision_file" type="file" accept="image/*">
            <span class="qfy_vision_drop_text" id="qfy_vision_drop_text">点击选择图片（jpg / png / webp / gif，≤ 10MB）</span>
            <img class="qfy_vision_preview" id="qfy_vision_preview" alt="图片预览" hidden>
          </label>
          <button class="qfy_btn" id="qfy_vision_btn" type="button">识别图片</button>
        </div>

        <p class="qfy_kb_hint" id="qfy_vision_tip">选择图片后点击「识别图片」，结果会同时输出到浏览器控制台。</p>

        <div class="qfy_kb_answer" id="qfy_vision_result" hidden>
          <p class="qfy_kb_answer_label">描述</p>
          <p class="qfy_kb_answer_text" id="qfy_vision_desc"></p>
          <p class="qfy_kb_hint" id="qfy_vision_meta"></p>
        </div>

        <a class="qfy_back_link" href="index.html">← 返回首页</a>
      </div>
    </header>

    <footer class="qfy_footer">
      <p>© 2026 齐方圆 · 24001011031 · 网页设计课程作业</p>
    </footer>
  </main>

  <script src="js/origin_guard.js"></script>
  <script src="js/vision.js"></script>
</body>
</html>
