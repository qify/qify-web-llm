<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>画世界 - 作品识别</title>
  <link rel="stylesheet" href="css/art.css">
  <link rel="stylesheet" href="css/vision.css">
</head>
<body class="qfy_art_body">
  <div class="qfy_main">
    <header class="qfy_nav_bar">
      <a class="qfy_nav_back" href="art-profile.html">‹</a>
      <span class="qfy_nav_title">作品识别</span>
      <span class="qfy_nav_side"></span>
    </header>

    <p class="qfy_cs_api_line">后端接口：
      <a class="qfy_cs_api_link" href="/api/vision" target="_blank">POST /api/vision</a>
    </p>

    <div class="qfy_card_block">
      <p class="qfy_sec_title">上传作品图片<span class="qfy_sec_sub">jpg / png / webp / gif，≤ 10MB</span></p>
      <label class="qfy_upload_box" for="qfy_vision_file">
        <input type="file" id="qfy_vision_file" accept="image/*">
        <span id="qfy_vision_drop_text">点击选择图片</span>
      </label>
      <img class="qfy_vision_img" id="qfy_vision_preview" alt="图片预览" hidden>
    </div>

    <div class="qfy_card_block">
      <button class="qfy_btn qfy_btn_block" id="qfy_vision_btn" type="button">识别图片</button>
      <p class="qfy_empty" id="qfy_vision_tip">选择图片后点击「识别图片」，结果会同时输出到浏览器控制台。</p>
    </div>

    <div class="qfy_card_block" id="qfy_vision_result" hidden>
      <p class="qfy_sec_title">描述</p>
      <p class="qfy_result" id="qfy_vision_desc"></p>
      <p class="qfy_news_meta" id="qfy_vision_meta"></p>
    </div>

    <footer class="qfy_art_footer">© 2026 齐方圆 · 24001011031 · 画世界</footer>
  </div>

  <script src="js/origin_guard.js"></script>
  <script src="js/vision.js"></script>
</body>
</html>
